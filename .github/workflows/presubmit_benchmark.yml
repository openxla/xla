# .github/workflows/presubmit_benchmark.yml
name: Presubmit Benchmarks

on:
  workflow_dispatch:
    inputs:
      benchmark_filter:
        description: "Regex to filter by benchmark name (e.g., 'gemma3_.*')."
        required: false
        type: string
        default: ""
      environment_filter:
        description: "Regex to filter by environment configuration ID (e.g., 'gpu_.*')."
        required: false
        type: string
        default: ""

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Scope to the PR head ref so a new push cancels in-flight presubmit runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run_benchmarks:
    name: Run XLA Presubmit Benchmarks
    uses: google-ml-infra/bap/.github/workflows/run-benchmarks.yaml@887b34acdb5c70bbd2bc93bb11c2d0a103698e7f # main
    with:
      registry_file: "xla/tools/benchmarks/benchmark_registry.pbtxt"
      tag_filter: "presubmit"
      bap_ref: "887b34acdb5c70bbd2bc93bb11c2d0a103698e7f"
      publish_metrics: false
      benchmark_filter: ${{ inputs.benchmark_filter || '' }}
      environment_filter: ${{ inputs.environment_filter || '' }}
