name: Rerun Failed Jobs

permissions: {}

on:
  # `pull_request_target` runs in the base repository context, providing a token
  # that can rerun failed workflow jobs and remove the trigger label even on PRs
  # from forks. This is safe because the job never checks out or executes
  # untrusted PR code.
  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types:
      - labeled

jobs:
  rerun-failed-jobs:
    name: Rerun Failed Jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.repository == 'openxla/xla' &&
      github.event.label.name == 'ci:rerun-failed'
    permissions:
      actions: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Rerun failed jobs for HEAD commit
        run: |
          set -euo pipefail

          gh run list \
            --repo "${REPOSITORY}" \
            --commit "${HEAD_SHA}" \
            --status failure \
            --limit 100 \
            --json databaseId \
            --jq '.[].databaseId' \
            | xargs -r -n1 gh run rerun --failed --repo "${REPOSITORY}"

      - name: Remove ci:rerun-failed label
        if: always()
        run: |
          gh api \
            --method DELETE \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels/ci%3Arerun-failed" || true
